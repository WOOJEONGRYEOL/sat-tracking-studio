<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243769"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#e8960f"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#1b3f8a"/>
    </linearGradient>
    <clipPath id="sq"><rect x="32" y="32" width="960" height="960" rx="210"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="32" y="32" width="960" height="960" fill="url(#bg)"/>
    <!-- 별 -->
    <g fill="#ffffff">
      <circle cx="180" cy="170" r="7" opacity=".9"/>
      <circle cx="840" cy="140" r="5" opacity=".7"/>
      <circle cx="300" cy="110" r="4" opacity=".6"/>
      <circle cx="720" cy="230" r="6" opacity=".8"/>
      <circle cx="120" cy="330" r="4" opacity=".5"/>
      <circle cx="900" cy="320" r="4" opacity=".6"/>
      <circle cx="520" cy="130" r="5" opacity=".7"/>
    </g>
    <!-- 지구 호 -->
    <circle cx="512" cy="1730" r="900" fill="url(#earth)"/>
    <circle cx="512" cy="1730" r="900" fill="none" stroke="#9fd8ff" stroke-width="14" opacity=".85"/>

    <!-- ISS -->
    <g>
      <!-- 트러스 -->
      <rect x="92" y="492" width="840" height="40" rx="14" fill="#e8edf8"/>
      <!-- 태양전지판 4쌍 -->
      <g fill="url(#panel)" stroke="#7a4d00" stroke-width="10">
        <rect x="112" y="282" width="150" height="460" rx="14"/>
        <rect x="296" y="282" width="150" height="460" rx="14"/>
        <rect x="578" y="282" width="150" height="460" rx="14"/>
        <rect x="762" y="282" width="150" height="460" rx="14"/>
      </g>
      <!-- 패널 결선 -->
      <g stroke="#7a4d00" stroke-width="8" opacity=".75">
        <line x1="187" y1="292" x2="187" y2="732"/>
        <line x1="371" y1="292" x2="371" y2="732"/>
        <line x1="653" y1="292" x2="653" y2="732"/>
        <line x1="837" y1="292" x2="837" y2="732"/>
        <line x1="112" y1="397" x2="262" y2="397"/>
        <line x1="112" y1="512" x2="262" y2="512"/>
        <line x1="112" y1="627" x2="262" y2="627"/>
        <line x1="296" y1="397" x2="446" y2="397"/>
        <line x1="296" y1="512" x2="446" y2="512"/>
        <line x1="296" y1="627" x2="446" y2="627"/>
        <line x1="578" y1="397" x2="728" y2="397"/>
        <line x1="578" y1="512" x2="728" y2="512"/>
        <line x1="578" y1="627" x2="728" y2="627"/>
        <line x1="762" y1="397" x2="912" y2="397"/>
        <line x1="762" y1="512" x2="912" y2="512"/>
        <line x1="762" y1="627" x2="912" y2="627"/>
      </g>
      <!-- 중앙 모듈 -->
      <rect x="466" y="332" width="92" height="360" rx="40" fill="#ffffff" stroke="#9aa7c4" stroke-width="8"/>
      <rect x="438" y="426" width="148" height="78" rx="36" fill="#ffffff" stroke="#9aa7c4" stroke-width="8"/>
      <circle cx="512" cy="376" r="26" fill="#243769"/>
      <circle cx="512" cy="648" r="26" fill="#243769"/>
    </g>
  </g>
</svg>
